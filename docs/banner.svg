<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1020"/>
      <stop offset="1" stop-color="#05060d"/>
    </linearGradient>
    <radialGradient id="glowL" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff3d6e" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ff3d6e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowT" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cff" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#8b5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb020" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ffb020" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff3d6e"/>
      <stop offset="0.45" stop-color="#8b5cff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7a9a"/>
      <stop offset="0.5" stop-color="#b79bff"/>
      <stop offset="1" stop-color="#5fe3f5"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <rect width="1280" height="400" fill="url(#bg)"/>

  <!-- Ambilight-Schein hinter dem Fernseher -->
  <ellipse cx="770" cy="200" rx="150" ry="150" fill="url(#glowL)"/>
  <ellipse cx="960" cy="105" rx="230" ry="110" fill="url(#glowT)"/>
  <ellipse cx="1150" cy="200" rx="150" ry="150" fill="url(#glowR)"/>
  <ellipse cx="960" cy="300" rx="200" ry="80" fill="url(#glowB)"/>

  <!-- Fernseher -->
  <rect x="810" y="110" width="300" height="175" rx="8" fill="#05060d" stroke="#2a2f45" stroke-width="3"/>
  <rect x="822" y="122" width="276" height="151" rx="3" fill="url(#screen)" opacity="0.9"/>
  <path d="M822 273 L900 200 L960 245 L1020 185 L1098 250 L1098 273 Z" fill="#05060d" opacity="0.55"/>
  <circle cx="1045" cy="160" r="16" fill="#fff4c2" opacity="0.9"/>
  <rect x="945" y="285" width="30" height="16" fill="#1b1f30"/>
  <rect x="905" y="300" width="110" height="7" rx="3" fill="#1b1f30"/>

  <!-- Lampe links (Stehlampe) -->
  <ellipse cx="680" cy="150" rx="40" ry="40" fill="#ff3d6e" opacity="0.55" filter="url(#blur)"/>
  <path d="M662 130 L698 130 L708 162 L652 162 Z" fill="#ff5a85"/>
  <rect x="678" y="162" width="4" height="150" fill="#2a2f45"/>
  <rect x="660" y="310" width="40" height="6" rx="3" fill="#2a2f45"/>

  <!-- Lampe rechts (Kugel) -->
  <ellipse cx="1220" cy="268" rx="38" ry="38" fill="#22d3ee" opacity="0.55" filter="url(#blur)"/>
  <circle cx="1220" cy="268" r="22" fill="#5fe3f5"/>
  <rect x="1205" y="290" width="30" height="20" rx="4" fill="#2a2f45"/>

  <!-- LED-Streifen unter dem Sideboard -->
  <rect x="760" y="330" width="400" height="10" rx="5" fill="#ffb020" opacity="0.5" filter="url(#blur)"/>
  <rect x="760" y="332" width="400" height="5" rx="2.5" fill="#ffc35a"/>

  <!-- Text -->
  <text x="70" y="170" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="58" font-weight="700" fill="url(#title)">ambiair-hue-bridge</text>
  <text x="72" y="222" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#c9cde0">Your TV's Ambilight on every Hue light.</text>
  <text x="72" y="258" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#7d84a3">No Sync Box · works with Netflix · 100% local</text>
</svg>
